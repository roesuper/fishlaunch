<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: #070b12; font-family: "Segoe UI", Inter, Arial, sans-serif; color: #fff; }
      .bg { position: absolute; inset: 0; background: radial-gradient(90% 70% at 20% 30%, #0f2b3a 0%, #070b12 60%), radial-gradient(60% 60% at 90% 90%, #1c1440 0%, transparent 60%); }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(70% 70% at 50% 50%, #000 30%, transparent 100%); }
      .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; align-items: center; gap: 56px; }
      .logo { width: 220px; height: 220px; border-radius: 52px; box-shadow: 0 30px 80px rgba(34,211,238,0.35); flex: none; }
      h1 { font-size: 88px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
      h1 span { background: linear-gradient(90deg, #22d3ee, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p { margin-top: 18px; font-size: 34px; color: #c7d2dd; font-weight: 500; line-height: 1.3; max-width: 760px; }
      .pills { margin-top: 30px; display: flex; gap: 12px; flex-wrap: wrap; }
      .pill { padding: 10px 18px; border-radius: 999px; font-size: 22px; font-weight: 700; color: #04121a; background: #22d3ee; }
      .pill.v { background: #a78bfa; }
      .pill.g { background: #34d399; }
      .url { position: absolute; right: 72px; bottom: 44px; font-size: 26px; font-weight: 700; color: #8fb3c4; letter-spacing: 0.5px; }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="grid"></div>
    <div class="wrap">
      <img class="logo" src="logo.png" />
      <div>
        <h1>Fish<span>Launch</span></h1>
        <p>The free Roblox &amp; Fortnite launcher: presets, launch boost, live ping HUD, honest PC tweaks.</p>
        <div class="pills"><span class="pill">Free</span><span class="pill v">No admin</span><span class="pill g">Updates itself</span></div>
      </div>
    </div>
    <div class="url">fishlaunch.pages.dev</div>
  </body>
</html>
