<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FishLaunch — Changelog</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .log {
        max-width: 820px;
        margin: 0 auto;
        padding: 50px clamp(16px, 5vw, 64px) 90px;
      }
      .rel {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--glass);
        padding: 20px 22px;
        margin-top: 14px;
        animation: rise 0.5s var(--ease) both;
      }
      .rel-h {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .rel-h b {
        font-family: var(--font-display);
        font-size: 20px;
      }
      .tag {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--accent-grad);
        color: #04121a;
        font-weight: 700;
      }
      .rel-h time,
      .rel-h .dl {
        color: var(--dim);
        font-size: 13px;
      }
      .rel-h .get {
        margin-inline-start: auto;
      }
      .rel ul {
        margin: 12px 0 0;
        padding-inline-start: 18px;
        color: var(--muted);
        display: grid;
        gap: 5px;
      }
      .rel li::marker {
        color: var(--cyan);
      }
      .rel p {
        color: var(--muted);
        margin-top: 10px;
      }
      .app-note {
        margin-top: 24px;
        color: var(--dim);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
    <header class="nav">
      <a class="brand" href="index.html"><img src="logo.png" alt="" /><span>FishLaunch</span></a>
      <nav>
        <a href="index.html#features">Features</a>
        <a href="index.html#browser">FishBrowser</a>
        <a href="changelog.html" style="color: var(--text)">Changelog</a>
      </nav>
      <div class="nav-right"><a class="btn sm" href="index.html#download">Download</a></div>
    </header>
    <main>
      <section class="log">
        <h2>Changelog</h2>
        <p class="sub">Every version, straight from the release notes. Installed copies pick these up on their own.</p>
        <div id="list"><div class="rel"><div class="rel-h"><b>Loading…</b></div></div></div>
        <div class="app-note">Also shows the FishBrowser releases below the FishLaunch ones.</div>
      </section>
    </main>
    <footer>
      <span>© <span id="year"></span> Fishy</span>
      <span><a href="https://github.com/roesuper/fishlaunch/releases" target="_blank" rel="noopener">GitHub releases</a></span>
    </footer>
    <script>
      document.getElementById("year").textContent = String(new Date().getFullYear());
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      function notesHtml(body) {
        const lines = (body || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const items = lines.filter((l) => /^[-*•]/.test(l)).map((l) => l.replace(/^[-*•]\s*/, ""));
        if (items.length) return "<ul>" + items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul>";
        return lines.length ? "<p>" + esc(lines.join(" ")) + "</p>" : "<p>Bug fixes and improvements.</p>";
      }
      async function load(repo, name) {
        const r = await fetch(`https://api.github.com/repos/${repo}/releases?per_page=30`);
        if (!r.ok) return [];
        return (await r.json()).map((rel) => ({ name, rel }));
      }
      Promise.all([load("roesuper/fishlaunch", "FishLaunch"), load("roesuper/fishbrowser", "FishBrowser")]).then(([a, b]) => {
        const all = [...a, ...b].sort((x, y) => new Date(y.rel.published_at) - new Date(x.rel.published_at));
        const el = document.getElementById("list");
        if (!all.length) {
          el.innerHTML = '<div class="rel"><div class="rel-h"><b>Could not reach GitHub</b></div></div>';
          return;
        }
        const seen = new Set();
        el.innerHTML = all
          .map(({ name, rel }, i) => {
            const latest = !seen.has(name);
            seen.add(name);
            const exe = rel.assets.find((x) => /setup\.exe$/i.test(x.name) && !/^\w+-Setup/.test(x.name)) || rel.assets.find((x) => x.name.endsWith(".exe"));
            const dls = rel.assets.filter((x) => x.name.endsWith(".exe")).reduce((s, x) => s + x.download_count, 0);
            return `<div class="rel" style="--d:${i * 40}ms"><div class="rel-h"><b>${esc(name)} ${esc(rel.tag_name.replace(/^v/, ""))}</b>${latest ? '<span class="tag">latest</span>' : ""}<time>${new Date(rel.published_at).toLocaleDateString()}</time><span class="dl">${dls} downloads</span>${exe ? `<a class="btn sm ghost get" href="${exe.browser_download_url}">Download</a>` : ""}</div>${notesHtml(rel.body)}</div>`;
          })
          .join("");
      });
    </script>
  </body>
</html>
